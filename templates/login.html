<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion | Horus Panel</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/horus.png') }}" type="image/x-icon">
    <style>
        :root { --accent: #00E0FF; --bg: #2E303F; --card: #232531; --input-bg: #1A1B26; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { 
            background: var(--card); 
            padding: 40px; 
            border-radius: 12px; 
            text-align: center; 
            width: 330px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-top: 4px solid var(--accent);
        }
        h2 { letter-spacing: 1px; margin-bottom: 25px; font-weight: 700; }
        input { 
            background: var(--input-bg); border: 1px solid #3F4254; color: white; 
            padding: 14px; margin-bottom: 15px; width: 100%; box-sizing: border-box; border-radius: 8px; 
        }
        button { 
            background: var(--accent); color: #1A1B26; border: none; padding: 16px; 
            cursor: pointer; font-weight: 800; width: 100%; border-radius: 8px; text-transform: uppercase; 
            transition: 0.3s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .flashes { color: #ff5555; font-size: 12px; margin-bottom: 15px; list-style: none; padding: 0; }
        a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: var(--accent)">HORUS PANEL</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}<ul class="flashes">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Pseudo" required autocomplete="off">
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit">Connexion</button>
        </form>
        <p style="margin-top: 25px;"><a href="/register">CRÉER UN COMPTE</a></p>
    </div>
</body>
</html>
